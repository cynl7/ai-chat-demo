<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 对话助手 Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col items-center justify-center p-4">

    <!-- 聊天窗口 -->
    <div class="w-full max-w-2xl bg-white rounded-lg shadow-lg flex flex-col h-[80vh]">
        <!-- 顶部栏 -->
        <div class="bg-blue-600 text-white p-4 rounded-t-lg flex justify-between items-center">
            <h1 class="font-bold">AI 智能助手 (纯前端版)</h1>
            <span class="text-xs bg-blue-500 px-2 py-1 rounded">流式输出已开启</span>
        </div>

        <!-- 消息列表 -->
        <div id="chat-box" class="flex-1 p-4 overflow-y-auto space-y-4">
            <!-- 欢迎语 -->
            <div class="flex">
                <div class="bg-gray-200 text-gray-800 p-3 rounded-lg max-w-[80%]">
                    你好！我是基于大模型搭建的 AI 助手，有什么可以帮你的？
                </div>
            </div>
        </div>

        <!-- 输入区 -->
        <div class="p-4 border-t flex gap-2">
            <input type="text" id="user-input" placeholder="输入你想问的问题..." 
                   class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500"
                   onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()" id="send-btn"
                    class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">
                发送
            </button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        let chatHistory = []; // 用于保存多轮对话历史

        function appendMessage(text, role) {
            const div = document.createElement('div');
            div.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            div.innerHTML = `
                <div class="${role === 'user' ? 'bg-blue-500 text-white' : 'bg-gray-200 text-gray-800'} p-3 rounded-lg max-w-[80%] whitespace-pre-wrap">
                    ${text}
                </div>
            `;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div.querySelector('div'); // 返回实际的消息气泡，用于流式更新
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // 1. 显示用户消息
            appendMessage(text, 'user');
            userInput.value = '';
            chatHistory.push({ role: 'user', content: text });

            // 2. 准备 AI 消息气泡
            const aiBubble = appendMessage('思考中...', 'ai');
            sendBtn.disabled = true;
            sendBtn.innerText = '生成中...';

            try {
                // 3. 发起请求（注意：这里请求的是我们自己的 /api/chat，不是外部API）
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: chatHistory })
                });

                if (!response.ok) throw new Error('网络请求失败');

                // 4. 处理流式输出（打字机效果）
                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                aiBubble.innerText = ''; // 清空“思考中”
                let aiText = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    // 解析 SSE 数据
                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                            try {
                                const data = JSON.parse(line.slice(6));
                                if (data.choices && data.choices[0].delta.content) {
                                    const content = data.choices[0].delta.content;
                                    aiText += content;
                                    aiBubble.innerText = aiText;
                                    chatBox.scrollTop = chatBox.scrollHeight;
                                }
                            } catch (e) {
                                // 忽略解析错误的空行
                            }
                        }
                    }
                }
                
                // 将 AI 的回复加入历史记录
                chatHistory.push({ role: 'assistant', content: aiText });

            } catch (error) {
                aiBubble.innerText = '抱歉，请求出错了：' + error.message;
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerText = '发送';
            }
        }
    </script>
</body>
</html>
